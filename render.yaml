services:
  - type: web
    name: trademind
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trademind-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: trademind-db
    plan: basic_256mb
